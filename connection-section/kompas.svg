<svg width="200" height="200" viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Основные линии осей (W-E, N-S) -->
  <line x1="20" y1="100" x2="180" y2="100" stroke="#3D4D5C" stroke-width="1.5"/>
  <line x1="100" y1="20" x2="100" y2="180" stroke="#3D4D5C" stroke-width="1.5"/>

  <!-- Диагональные линии (NW-SE, NE-SW) -->
  <line x1="43.43" y1="43.43" x2="156.57" y2="156.57" stroke="#3D4D5C" stroke-width="1"/>
  <line x1="156.57" y1="43.43" x2="43.43" y2="156.57" stroke="#3D4D5C" stroke-width="1"/>

  <!-- Внутренний темный круг -->
  <circle cx="100" cy="100" r="45" fill="#242D36" fill-opacity="0.6"/>

  <!-- Текст сторон света (W, E, N, S) -->
  <text x="35" y="108" fill="#447F8D" font-family="Arial, sans-serif" font-size="24" font-weight="500" text-anchor="middle">W</text>
  <text x="165" y="108" fill="#447F8D" font-family="Arial, sans-serif" font-size="24" font-weight="500" text-anchor="middle">E</text>
  <text x="100" y="45" fill="#447F8D" font-family="Arial, sans-serif" font-size="24" font-weight="500" text-anchor="middle">N</text>
  <text x="100" y="172" fill="#447F8D" font-family="Arial, sans-serif" font-size="24" font-weight="500" text-anchor="middle">S</text>

  <!-- Центральный золотой ромб (стрелка) -->
  <path d="M100 70 L118 100 L100 130 L82 100 Z" fill="#FFBD4E"/>

  <!-- Центральная белая точка -->
  <circle cx="100" cy="100" r="5" fill="#FFFFFF"/>
</svg>
